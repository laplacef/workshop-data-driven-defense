[project]
name = "data-driven-defense"
version = "1.0.0"
description = "Workshop materials on applying machine learning to network traffic analysis for intrusion detection (Edge-IIoTset)."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "CC-BY-NC-SA-4.0"
license-files = ["LICENSE.md"]
authors = [{ name = "Francisco Laplace", url = "https://laplacef.me" }]
keywords = [
    "machine-learning",
    "intrusion-detection",
    "network-security",
    "edge-iiotset",
    "cybersecurity",
]

dependencies = [
    "dask[dataframe]==2024.10.0",
    "ipykernel==7.3.0",
    "jupyterlab>=4.6.3,<5",
    "kaggle==2.2.4",
    "matplotlib==3.11.1",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "scikit-learn==1.9.0",
    "sqlalchemy==2.0.52",
    "tqdm==4.70.0",
]

[tool.uv]
package = false
